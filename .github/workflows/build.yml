name: Build Monitor APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
      ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
      ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libffi-dev \
            libssl-dev unzip openjdk-17-jdk wget

      - name: Install Android SDK and NDK in Buildozer paths
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin" "$ANDROID_HOME/cmdline-tools" "$ANDROID_NDK"
          cd "$HOME/.buildozer/android/platform"

          if [ ! -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            if [ -d "$HOME/.buildozer/android/platform/cmdline-tools" ]; then
              mv "$HOME/.buildozer/android/platform/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tmp"
              mv "$ANDROID_HOME/cmdline-tools/tmp/bin" "$ANDROID_HOME/cmdline-tools/latest/bin"
              mv "$ANDROID_HOME/cmdline-tools/tmp/lib" "$ANDROID_HOME/cmdline-tools/latest/lib" 2>/dev/null || true
              rm -rf "$ANDROID_HOME/cmdline-tools/tmp"
            fi

            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
            ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          fi

          export PATH="$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;34.0.0"

          if [ ! -d "$ANDROID_NDK/toolchains" ] && [ ! -f "$ANDROID_NDK/ndk-build" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O android-ndk-r25b.zip
            unzip -q android-ndk-r25b.zip
            rm -rf "$ANDROID_NDK"
            mv android-ndk-r25b "$ANDROID_NDK"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.33 buildozer

      - name: Build APK
        run: |
          export PATH="$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: monitor-apk
          path: bin/*.apk
