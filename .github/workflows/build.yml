name: Build Monitor APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-dev ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libffi-dev \
            libssl-dev unzip openjdk-17-jdk wget \
            autoconf automake libtool pkg-config

      - name: Install Android SDK and required NDK
        run: |
          set -eux

          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools /usr/local/lib/android/sdk/tools/bin
          sudo chown -R "$USER:$USER" /usr/local/lib/android/sdk

          if [ ! -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest
            mkdir -p /usr/local/lib/android/sdk/cmdline-tools
            mv /tmp/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          fi

          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager /usr/local/lib/android/sdk/tools/bin/avdmanager

          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/tools/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.33" "buildozer==1.5.0"

      - name: Build APK with debug log
        run: |
          export PATH="/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/build-tools/34.0.0:$PATH"
          buildozer -v android debug > build.log 2>&1 || { tail -n 200 build.log; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: monitor-apk
          path: bin/*.apk
