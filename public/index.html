<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FamilyMonitor Download</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a 40%, #111827);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(92vw, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,.35);
      }
      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      .badge {
        display: inline-block;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent);
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        margin-bottom: 18px;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
      }
      .download-btn {
        display: inline-block;
        margin-top: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #03131d;
        text-decoration: none;
        font-weight: 700;
        padding: 16px 24px;
        border-radius: 12px;
        transition: transform 0.2s ease;
      }
      .download-btn:hover {
        transform: translateY(-1px);
      }
      .meta {
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">FamilyMonitor</div>
      <h1>Download APK</h1>
      <p>
        Aplikasi ini dibuat untuk memantau status perangkat dan mengirim data status secara sederhana.
        Gunakan tombol di bawah untuk mengunduh file APK terbaru.
      </p>
      <a class="download-btn" href="/apk/app-release.apk">Download APK</a>
      <div class="meta">
        Pastikan file APK sudah ada di folder <strong>public/apk/app-release.apk</strong> sebelum deploy.
      </div>
    </div>
  </body>
</html>
